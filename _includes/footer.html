{% assign footer_ui = site.data.settings.ui[current_lang] | default: site.data.settings.ui[site.default_language] %}
<footer class="gf-footer">
  <div class="gf-wrap gf-footer-inner">
    <p class="gf-footer-credit">{{ footer_ui.made_by }} <a href="https://github.com/jtemporal">@jtemporal</a></p>
    <nav class="gf-social" aria-label="Social">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" target="_blank" rel="noopener" aria-label="{% if item.icon == 'envelope' %}Email{% else %}{{ item.icon | capitalize }}{% endif %}"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </nav>
  </div>
</footer>
